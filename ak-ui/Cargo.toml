[package]
name = "ak-ui"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Prototype of the Arknights Client UI kit on gpui-ce"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ak-ui-showcase"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "43dacc568497c615c55a1ea0f77ab381c0d9865b", features = ["image-default-formats"] }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/gpui-ce/gpui-ce", rev = "43dacc568497c615c55a1ea0f77ab381c0d9865b", features = ["font-kit", "wayland", "x11"] }
