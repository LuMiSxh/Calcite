[package]
name = "calcite-showcase"
description = "Showcase and component gallery for Calcite and calcite-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "home"
path = "src/bin/home.rs"

[[bin]]
name = "gallery"
path = "src/bin/gallery/main.rs"

[dependencies]

gpui.workspace = true
gpui_platform.workspace = true
calcite.workspace = true
calcite-exec.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[build-dependencies]
calcite-bundle = { workspace = true, default-features = false }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

# `cargo calcite bundle -p calcite-showcase --bin gallery` packages the showcase.
[package.metadata.calcite.bundle]
name = "Calcite Showcase"
identifier = "dev.lumisxh.calcite.showcase"
icon = "assets/icon.png"
category = "DeveloperTool"
copyright = "© 2026 Luca Michael Schmidt"
minimum-macos = "13.0"

[features]
# `CALCITE_FRAME_STATS=1 cargo run --release --features frame-stats --bin gallery`
frame-stats = ["calcite/frame-stats"]
