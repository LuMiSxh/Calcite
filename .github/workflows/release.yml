name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.1); must match the workspace version in Cargo.toml"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ inputs.tag }}

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag format, version, and that the tag is new
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          cargo_version="$(awk -F'"' '/^\[workspace\.package\]/{s=1; next} /^\[/{s=0} s && /^version/{print $2; exit}' Cargo.toml)"
          if [ "$cargo_version" != "${TAG#v}" ]; then
            echo "::error::Tag version (${TAG#v}) does not match Cargo.toml version ($cargo_version)"
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

  windows:
    name: Build the developer preview (Windows)
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Fetch and patch gpui-ce
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Build the developer preview
        run: cargo build --release --locked -p calcite-showcase --bin preview

      - name: Package the standalone executable
        shell: pwsh
        run: |
          $out = cargo run --release --locked -p calcite-bundle -- calcite bundle -p calcite-showcase --bin preview --format exe --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = ($out | Select-String '^\s*exe\s+(.+)$').Matches[0].Groups[1].Value
          $name = "calcite-preview-x86_64-pc-windows-msvc.exe"
          Copy-Item $exe $name
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() + "  $name" | Out-File -Encoding ascii "$name.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calcite-preview-x86_64-pc-windows-msvc
          path: |
            calcite-preview-x86_64-pc-windows-msvc.exe
            calcite-preview-x86_64-pc-windows-msvc.exe.sha256
          if-no-files-found: error

  release:
    name: Tag and publish the release
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the git tag
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Extract the changelog section of this version
        run: |
          awk -v version="${TAG#v}" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "Release $TAG" > release_notes.md
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release_notes.md \
            artifacts/*
