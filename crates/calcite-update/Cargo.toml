[package]
name = "calcite-update"
description = "Signed, delta-capable app updates for Calcite apps: an Ed25519-signed feed, per-file zstd patches, staged installs on quit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "calcite-update"
path = "src/main.rs"
required-features = ["publish"]

[features]
default = ["client"]
# Checking, downloading, staging, and installing updates.
client = ["dep:ureq"]
# Writing releases: manifests, full archives, deltas, and the signed feed.
publish = ["dep:getrandom"]
# Lets an `Updater` read `file://` feeds, for tests and release dry runs. Never enable it in an app.
test-support = []

[dependencies]
ed25519-dalek = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zstd = "0.14"
ureq = { version = "3", optional = true }
getrandom = { version = "0.3", optional = true }

[dev-dependencies]
calcite-update = { path = ".", features = ["publish", "test-support"] }
