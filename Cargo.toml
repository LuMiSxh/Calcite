[workspace]
resolver = "3"
members = ["crates/calcite", "crates/calcite-exec", "crates/calcite-tint", "crates/calcite-bundle", "crates/calcite-update", "crates/calcite-showcase"]
default-members = ["crates/calcite-showcase"]
exclude = ["vendor", "third_party/gpui-ce"]

[workspace.package]
version = "0.4.0"
edition = "2024"
# gpui-ce needs 1.95; CI and the README test 1.97.
rust-version = "1.97"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
# gpui-ce at the commit in third_party/gpui-ce/REVISION, with patches/*.patch applied.
# scripts/vendor-sync.sh rebuilds the directory. Features come from the calcite crate.
gpui = { package = "gpui-ce", path = "third_party/gpui-ce/crates/gpui", default-features = false }
gpui_platform = { package = "gpui_ce_platform", path = "third_party/gpui-ce/crates/gpui_platform" }
gpui_ce_elements = { path = "third_party/gpui-ce/crates/gpui_elements" }
futures = "0.3"
calcite = { path = "crates/calcite" }
calcite-exec = { path = "crates/calcite-exec" }
calcite-tint = { path = "crates/calcite-tint" }
calcite-bundle = { path = "crates/calcite-bundle", default-features = false }
calcite-update = { path = "crates/calcite-update" }

[profile.dev.package."*"]
opt-level = 2
# Dependencies build without debug info: it keeps target/ small and links faster.
debug = false

# Debug builds of the library otherwise draw about 40% slower than release (13.8 vs 10 ms per frame).
[profile.dev.package.calcite]
opt-level = 1

[profile.dev.package.calcite-exec]
opt-level = 1

[profile.dev.package.calcite-tint]
opt-level = 1
