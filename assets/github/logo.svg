<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe9ff"/>
      <stop offset="1" stop-color="#18d1ff"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb6e8"/>
      <stop offset="1" stop-color="#2163a8"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4f86"/>
      <stop offset="1" stop-color="#14254a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#plate)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
  <!-- A calcite rhombohedron: three visible faces. -->
  <polygon points="256,92 404,178 256,262 108,178" fill="url(#light)"/>
  <polygon points="108,178 256,262 256,420 108,334" fill="url(#mid)"/>
  <polygon points="404,178 404,334 256,420 256,262" fill="url(#dark)"/>
  <polyline points="108,178 256,92 404,178" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="5" stroke-linejoin="round"/>
  <polyline points="108,178 256,262 404,178 M256,262 256,420" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round"/>
</svg>
