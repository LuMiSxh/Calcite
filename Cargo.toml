[workspace]
resolver = "3"
members = ["crates/calcite", "crates/calcite-exec", "crates/calcite-tint", "crates/calcite-bundle", "crates/calcite-update", "crates/calcite-showcase"]
default-members = ["crates/calcite-showcase"]
exclude = ["vendor"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
# gpui-ce at the commit in patches/GPUI_CE_REVISION, with patches/*.patch applied.
# Run scripts/bootstrap.sh (macOS, Linux) or scripts/bootstrap.ps1 (Windows) first.
gpui = { package = "gpui-ce", path = "vendor/gpui-ce/crates/gpui", features = ["image-default-formats"] }
gpui_platform = { package = "gpui_ce_platform", path = "vendor/gpui-ce/crates/gpui_platform", features = ["font-kit", "wayland", "x11"] }
gpui_ce_elements = { path = "vendor/gpui-ce/crates/gpui_elements" }
futures = "0.3"
calcite = { path = "crates/calcite" }
calcite-exec = { path = "crates/calcite-exec" }
calcite-tint = { path = "crates/calcite-tint" }
calcite-bundle = { path = "crates/calcite-bundle", default-features = false }
calcite-update = { path = "crates/calcite-update" }

[profile.dev.package."*"]
opt-level = 2
# Dependencies build without debug info: it keeps target/ small and links faster.
debug = false

# Debug builds of the library otherwise draw about 40% slower than release (13.8 vs 10 ms per frame).
[profile.dev.package.calcite]
opt-level = 1

[profile.dev.package.calcite-exec]
opt-level = 1

[profile.dev.package.calcite-tint]
opt-level = 1
